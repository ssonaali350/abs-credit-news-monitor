name: Daily News Ingest

on:
  schedule:
    # 12:07 UTC ≈ 8:07am EDT / 7:07am EST. Deliberately NOT :00 — GitHub's own
    # docs warn top-of-hour is the most congested slot for scheduled workflows
    # and can cause delays or dropped runs (which is what happened on the
    # original 0 12 * * * schedule: it never fired at all on its first
    # scheduled day). Off-the-hour minutes are far less likely to be affected.
    - cron: '7 12 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so this workflow can commit updated data files back

# Fixes the root cause, not another symptom: overlapping runs (GitHub's own
# schedule, the Cloudflare Cron Trigger fallback, and manual dispatches can
# all land close together) were racing to commit/push at the same time.
# The pull-rebase-retry loop below only handles a *clean* divergence; a
# concurrent run editing the same lines produces a real merge conflict it
# can't resolve, which is what actually happened during testing. Queuing
# overlapping runs instead of letting them race removes the conflict
# entirely rather than getting better at recovering from it.
# cancel-in-progress: false because a run may be mid-way through paid
# Claude API calls - canceling it would waste that spend for nothing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 ingest.py --limit 50

      - name: Fetch live market data (SOFR, OAS spreads, Treasury yields)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 fetch_market_data.py

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add structured_news.jsonl seen.json daily_summaries.jsonl sample_holdings.json market_ticker.json
          git diff --cached --quiet || git commit -m "Automated news ingest $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Self-heal if main moved since checkout (e.g. a manual push landed
          # at the same moment) - rebase and retry once instead of failing
          # the whole run and silently discarding this run's ingested data.
          for i in 1 2 3; do
            if git push; then break; fi
            echo "push rejected, pulling --rebase and retrying ($i/3)"
            git pull --rebase origin main
          done
