name: Daily News Ingest

on:
  schedule:
    # 12:00 UTC ≈ 8am EDT / 7am EST — adjust if you want a different local time.
    - cron: '0 12 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so this workflow can commit updated data files back

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 ingest.py --limit 50

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add structured_news.jsonl seen.json daily_summaries.jsonl sample_holdings.json
          git diff --cached --quiet || git commit -m "Automated news ingest $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
